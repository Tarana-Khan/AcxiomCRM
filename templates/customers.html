
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers | AcxiomCRM</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div class="app-layout">

    <aside class="sidebar">
        <div class="sidebar-brand"><span class="brand-logo">A</span> AcxiomCRM</div>
        <nav class="sidebar-nav">
            <a th:href="@{/dashboard}" class="nav-link">Dashboard</a>
            <a th:href="@{/customers}" class="nav-link active">Customers</a>
            <a th:href="@{/leads}" class="nav-link">Leads</a>
            <a th:href="@{/opportunities}" class="nav-link">Opportunities</a>
            <a th:href="@{/followups}" class="nav-link">Follow-ups</a>
            <a th:href="@{/activities}" class="nav-link">Activities</a>
            <a th:href="@{/reports}" class="nav-link">Reports</a>
        </nav>
        <form th:action="@{/logout}" method="post">
            <button class="nav-link logout-button">Logout</button>
        </form>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>
                <h1>Customers</h1>
                <p class="muted">Manage your customer relationships.</p>
            </div>
            <a th:href="@{/customers/new}" class="btn btn-primary">+ Add Customer</a>
        </header>

        <section class="content-card">
            <form th:action="@{/customers}" method="get" class="search-form">
                <input type="text" name="search" th:value="${search}"
                       placeholder="Search customers by name">
                <button class="btn btn-primary">Search</button>
                <a th:href="@{/customers}" class="btn btn-outline">Reset</a>
            </form>

            <div class="table-responsive" th:if="${customers != null}">
                <table>
                    <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Company</th>
                        <th>City</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="customer : ${customers}">
                        <td th:text="${customer.customerName}"></td>
                        <td th:text="${customer.email}"></td>
                        <td th:text="${customer.phone}"></td>
                        <td th:text="${customer.companyName}"></td>
                        <td th:text="${customer.city}"></td>
                        <td>
                            <span class="status-pill"
                                  th:text="${customer.status}"></span>
                        </td>
                        <td class="table-actions">
                            <a th:href="@{/customers/edit/{id}(id=${customer.id})}"
                               class="btn btn-small btn-outline">Edit</a>
                            <form th:action="@{/customers/delete/{id}(id=${customer.id})}"
                                  method="post"
                                  onsubmit="return confirm('Delete this customer?')">
                                <button class="btn btn-small btn-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(customers)}">
                        <td colspan="7" class="empty-state">No customers found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="content-card form-card"
                 th:if="${customer != null}">
            <h2 th:text="${customer.id == null ? 'Add Customer' : 'Edit Customer'}">
                Customer Form
            </h2>

            <form th:action="${customer.id == null ? '/customers/save' : '/customers/update/' + customer.id}"
                  th:object="${customer}" method="post">

                <div class="form-grid">
                    <div class="form-group">
                        <label>Customer Name</label>
                        <input type="text" th:field="*{customerName}" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" th:field="*{email}">
                    </div>

                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" th:field="*{phone}">
                    </div>

                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" th:field="*{companyName}">
                    </div>

                    <div class="form-group">
                        <label>City</label>
                        <input type="text" th:field="*{city}">
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <select th:field="*{status}" required>
                            <option value="">Select status</option>
                            <option th:each="s : ${T(com.acxiom.crm.enums.CustomerStatus).values()}"
                                    th:value="${s}" th:text="${s}"></option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>Address</label>
                        <textarea th:field="*{address}" rows="3"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">Save Customer</button>
                    <a th:href="@{/customers}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
